name: oclo-backend ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_HELIUS: ${{ secrets.SMOKE_HELIUS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: corepack disable  # use npm for CI simplicity
      - run: npm ci
      - run: npm run smoke
